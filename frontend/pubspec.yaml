name: noir_app
description: Invite-only NOIR APK workspace client for Android and macOS.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5
  go_router: ^17.0.0
  flutter_secure_storage: ^10.3.1
  file_picker: ^12.1.1
  crypto: ^3.0.7
  uuid: ^4.5.2
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/phantom.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/phantom.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/branding/phantom.png
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 23
  macos:
    generate: true
    image_path: assets/branding/phantom.png
